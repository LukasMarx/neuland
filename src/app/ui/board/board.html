<svg [attr.viewBox]="viewBox()" role="img" aria-label="Spielbrett">
  <defs><g appTerrainDefs></g></defs>
  <path class="ocean" [attr.d]="oceanPath()" fill="url(#g-ocean)" />
  <path class="ocean-texture" [attr.d]="oceanPath()" fill="url(#p-ocean-paper)" />
  <!-- Bewegtes Wasser: eine zweite, leicht durchsichtige Lage treibt langsam, an der Küste schäumt Brandung. -->
  <clipPath id="ocean-clip"><path [attr.d]="oceanPath()" /></clipPath>
  <g class="water-motion" clip-path="url(#ocean-clip)" aria-hidden="true">
    <path class="ocean-drift" [attr.d]="oceanPath()" fill="url(#p-ocean-paper)" />
  </g>
  <path class="foam" [attr.d]="coastPath()" aria-hidden="true" />

  <!-- Häfen und Fischgründe: die Stege zu den Ecken liegen unter den Feldern, die Schilder kommen später. -->
  @for (h of harbors(); track $index) {
    <g class="harbor">
      <line [attr.x1]="h.x" [attr.y1]="h.y" [attr.x2]="h.ax" [attr.y2]="h.ay" />
      <line [attr.x1]="h.x" [attr.y1]="h.y" [attr.x2]="h.bx" [attr.y2]="h.by" />
    </g>
  }

  @for (f of fishingGrounds(); track $index) {
    <g class="fishing">
      <line [attr.x1]="f.x" [attr.y1]="f.y" [attr.x2]="f.ax" [attr.y2]="f.ay" />
      <line [attr.x1]="f.x" [attr.y1]="f.y" [attr.x2]="f.bx" [attr.y2]="f.by" />
    </g>
  }

  @for (h of hexes(); track h.id) {
    <g class="hex" [attr.data-hex]="h.id" [class.hit]="h.hit" [class.robbed]="h.hit && h.robber" [class.sea]="h.sea" [class.fog]="h.fog" [class.revealed]="h.revealed">
      @if (h.sea) {
        <polygon class="sea-grid" [attr.points]="h.points" />
      } @else {
      @if (h.image) {
        <g class="art" [attr.transform]="'translate(' + h.x + ',' + h.y + ')'">
          <image [attr.href]="h.image" x="-51.96" y="-60" width="103.92" height="120" preserveAspectRatio="xMidYMid slice" clip-path="url(#hexclip)" />
        </g>
      } @else {
        <use class="art" [attr.href]="'#t-' + h.terrain" [attr.transform]="h.transform" />
      }
      <polygon class="shine" [attr.points]="h.points" fill="url(#g-shine)" />
      <polygon class="outline" [attr.points]="h.points" />
      }
      @if (h.fog) {
        <!-- Nebelschwaden treiben im Feld hin und her. -->
        <g class="mist" [attr.transform]="'translate(' + h.x + ',' + h.y + ')'" clip-path="url(#hexclip)" aria-hidden="true">
          <g class="mist-drift" [style.animation-delay]="h.phase">
            <ellipse cx="-34" cy="-22" rx="46" ry="13" fill="url(#g-mist)" />
            <ellipse cx="26" cy="6" rx="52" ry="14" fill="url(#g-mist)" />
            <ellipse cx="-12" cy="34" rx="44" ry="11" fill="url(#g-mist)" />
          </g>
        </g>
      }
      @if (h.revealed) {
        <!-- Aufgedeckt: Der Nebel löst sich über dem neuen Feld auf. -->
        <g class="fog-fade" [attr.transform]="'translate(' + h.x + ',' + h.y + ')'" aria-hidden="true">
          <g class="fog-fade-inner">
            <image href="web/tiles/papiercollage/fog.png" x="-51.96" y="-60" width="103.92" height="120" preserveAspectRatio="xMidYMid slice" clip-path="url(#hexclip)" />
          </g>
        </g>
      }
      @if (h.lake) {
        <g class="ripples" [attr.transform]="'translate(' + (h.x - 12) + ',' + (h.y - 22) + ')'" aria-hidden="true">
          <circle r="6" [style.animation-delay]="h.phase" />
          <circle r="6" class="late" [style.animation-delay]="h.phase" />
        </g>
      }
    </g>
  }

  <!-- Flussläufe: zwischen Gelände und Zahlen, damit die Zahlen lesbar bleiben; an der Küste abgeschnitten. -->
  @if (riverShapes().length) {
    <clipPath id="land-clip">
      @for (p of landOutline(); track $index) {
        <polygon [attr.points]="p" />
      }
    </clipPath>
  }
  @for (r of riverShapes(); track r.id) {
    <g class="river" clip-path="url(#land-clip)">
      <clipPath [attr.id]="r.clip">
        <path [attr.d]="r.water" />
        <circle [attr.cx]="r.spring.x" [attr.cy]="r.spring.y" [attr.r]="r.spring.r" />
      </clipPath>
      <!-- Dunkler, weicher Streifen Ufergrün: Der Fluss liegt im Gelände statt darauf. -->
      <path class="river-meadow" [attr.d]="r.meadow" />
      <circle class="river-meadow" [attr.cx]="r.spring.x" [attr.cy]="r.spring.y" [attr.r]="r.spring.r + 11" />
      <path class="river-bank" [attr.d]="r.bank" />
      <circle class="river-bank" [attr.cx]="r.spring.x" [attr.cy]="r.spring.y" [attr.r]="r.spring.r + 4" />
      <g [attr.clip-path]="'url(#' + r.clip + ')'">
        <!-- Tiefes Wasser, darüber das versetzte helle: Am oberen und linken Ufer bleibt ein Schattenrand. -->
        <path class="river-deep" [attr.d]="r.water" />
        <circle class="river-deep" [attr.cx]="r.spring.x" [attr.cy]="r.spring.y" [attr.r]="r.spring.r" />
        <g transform="translate(1.6,2.2)">
          <path class="river-water" [attr.d]="r.water" />
          <circle class="river-water" [attr.cx]="r.spring.x" [attr.cy]="r.spring.y" [attr.r]="r.spring.r" />
        </g>
        <path class="river-paper" [attr.d]="r.water" fill="url(#p-ocean-paper)" />
      </g>
      <path class="river-shine" [attr.d]="r.shine" />
    </g>
  }

  @for (h of hexes(); track h.id) {
    @if (h.lake || h.number || h.robber) {
      <g class="hex-top" [attr.data-hex]="h.id" [class.hit]="h.hit" [class.revealed]="h.revealed">
        @if (h.lake) {
          <g class="lake-numbers" [attr.transform]="h.tokenTransform || null">
            <rect [attr.x]="h.x - 26" [attr.y]="h.y + S * 0.05 - 9" width="52" height="18" rx="9" />
            <text [attr.x]="h.x" [attr.y]="h.y + S * 0.05">2 3 11 12</text>
          </g>
        }
        @if (h.number) {
          <g class="token" [class.red]="h.red" [class.blocked]="h.robber" [attr.transform]="h.tokenTransform || null">
            <circle class="shadow" [attr.cx]="h.x + 1.5" [attr.cy]="h.y + S * 0.05 + 2.5" [attr.r]="S * 0.3" />
            <circle class="disc" [attr.cx]="h.x" [attr.cy]="h.y + S * 0.05" [attr.r]="S * 0.3" fill="url(#g-token)" />
            <circle class="ring" [attr.cx]="h.x" [attr.cy]="h.y + S * 0.05" [attr.r]="S * 0.25" />
            <text class="number" [attr.x]="h.x" [attr.y]="h.y + S * 0.05">{{ h.number }}</text>
          </g>
        }
        @if (h.robber) {
          <g class="robber" [attr.transform]="h.robberTransform">
            <title>Räuber</title>
            <image class="piece-art" href="web/pieces/papiercollage/robber.png" x="-20" y="-20" width="40" height="40" />
          </g>
        }
      </g>
    }
  }

  <!-- Hafen- und Fischgrundschilder über den Feldern, aber unter Straßen und Schiffen: Spielfiguren gehen vor. -->
  @for (h of harbors(); track $index) {
    <g class="harbor" [attr.transform]="h.transform">
      <title>{{ h.title }}</title>
      <!-- Symbol und Scheibe teilen sich den Mittelpunkt (0, -4); das Schild sitzt darunter. -->
      <circle class="harbor-disc" cx="0" cy="-4" r="21" />
      @if (h.image) {
        <image class="harbor-art" [attr.href]="h.image" x="-12" y="-16" width="24" height="24" />
      } @else {
        <text class="harbor-any" x="0" y="-4">?</text>
      }
      <rect class="harbor-plaque" x="-15" y="12" width="30" height="15" rx="7.5" />
      <text class="harbor-rate" x="0" y="20">{{ h.label }}</text>
    </g>
  }

  @for (f of fishingGrounds(); track $index) {
    <g class="fishing" [class.hit]="f.hit" [attr.transform]="f.transform">
      <title>{{ f.title }}</title>
      <image class="fishing-art" href="web/icons/fishing/ground.png" x="-21" y="-21" width="42" height="42" />
      <text class="fishing-number" [class.red]="f.red" x="0" y="13">{{ f.number }}</text>
    </g>
  }

  @for (r of roads(); track r.id) {
    <g class="road" [class.bridge]="r.bridge" [attr.data-edge]="r.id">
      <title>{{ r.title }}</title>
      @if (r.bridge) {
        <rect class="bridge-deck" [attr.transform]="r.transform" [attr.x]="-r.length / 2 - 3" [attr.y]="-r.height / 2 - 4" [attr.width]="r.length + 6" [attr.height]="r.height + 8" rx="3" />
      }
      @if (r.image) {
        <image class="piece-art" [attr.href]="r.image" [attr.transform]="r.transform"
          [attr.x]="-r.length / 2" [attr.y]="-r.height / 2" [attr.width]="r.length" [attr.height]="r.height" />
      } @else {
        <line class="road-outline" [attr.x1]="r.x1" [attr.y1]="r.y1" [attr.x2]="r.x2" [attr.y2]="r.y2" />
        <line class="road-fill" [attr.x1]="r.x1" [attr.y1]="r.y1" [attr.x2]="r.x2" [attr.y2]="r.y2" [attr.stroke]="r.color" />
      }
    </g>
  }

  @for (sh of ships(); track sh.id) {
    <g class="ship" [attr.data-edge]="sh.id" [style.animation-delay]="sh.phase">
      <title>{{ sh.title }}</title>
      @if (sh.image) {
        <image class="piece-art" [attr.href]="sh.image" [attr.transform]="sh.imageTransform"
          [attr.x]="-sh.width / 2" [attr.y]="-sh.height / 2" [attr.width]="sh.width" [attr.height]="sh.height" />
      } @else {
        <use href="#ship" [attr.transform]="sh.transform" [attr.fill]="sh.color" />
      }
    </g>
  }

  @if (pirate(); as p) {
    <g class="pirate">
      <title>Kaperschiff</title>
      <image class="piece-art" href="web/pieces/papiercollage/pirate.png" [attr.x]="p.x - p.size / 2" [attr.y]="p.y - p.size / 2" [attr.width]="p.size" [attr.height]="p.size" />
    </g>
  }

  @for (w of guards(); track w.id) {
    <g class="guard" [class.resting]="!w.active" [attr.data-vertex]="w.id" [attr.transform]="'translate(' + w.x + ',' + w.y + ')'">
      <title>{{ w.title }}</title>
      <circle class="guard-base" [attr.r]="w.r" [attr.fill]="w.color" />
      @for (i of w.rings; track i) {
        <circle class="guard-ring" [attr.r]="w.r * (0.35 + 0.22 * i)" />
      }
      <path class="guard-helm" [attr.d]="'M' + -w.r * 0.45 + ',' + -w.r * 0.15 + ' L0,' + -w.r * 0.75 + ' L' + w.r * 0.45 + ',' + -w.r * 0.15 + ' Z'" />
    </g>
  }

  @for (b of buildings(); track b.id) {
    <g class="building" [attr.data-vertex]="b.id" [attr.transform]="'translate(' + b.x + ',' + b.y + ')'">
      <title>{{ b.title }}</title>
      @if (b.wall) {
        <circle class="wall" [attr.r]="b.size * 0.48" />
      }
      @if (b.image) {
        <image class="piece-art" [attr.href]="b.image" [attr.x]="-b.size / 2" [attr.y]="-b.size / 2"
          [attr.width]="b.size" [attr.height]="b.size" />
      } @else if (b.city) {
        <path [attr.fill]="b.color" d="M-16,11 L16,11 L16,-4 L4,-4 L4,-10 L-6,-19 L-16,-10 Z" />
      } @else {
        <path [attr.fill]="b.color" d="M-10,9 L10,9 L10,-3 L0,-12 L-10,-3 Z" />
      }
      @if (b.metro) {
        <g class="metro" [attr.data-track]="b.metro" [attr.transform]="'translate(' + b.size * 0.32 + ',' + -b.size * 0.42 + ')'">
          <circle r="8.5" />
          <text>{{ b.metroLabel }}</text>
        </g>
      }
    </g>
  }

  @for (h of hexSpots(); track h.id) {
    <g class="hex-target" (click)="hexPick.emit(h.id)">
      <title>Räuber hierhin</title>
      <polygon [attr.points]="h.points" />
      <g class="ghost-robber" [attr.transform]="'translate(' + h.x + ',' + (h.y - S * 0.05) + ')'">
        <image class="piece-art" href="web/pieces/papiercollage/robber.png" x="-20" y="-20" width="40" height="40" />
      </g>
    </g>
  }

  @for (e of edgeSpots(); track e.id) {
    <g class="edge-target" (click)="edgePick.emit(e.id)">
      <line class="hit" [attr.x1]="e.x1" [attr.y1]="e.y1" [attr.x2]="e.x2" [attr.y2]="e.y2" />
      <line class="mark" [attr.x1]="e.x1" [attr.y1]="e.y1" [attr.x2]="e.x2" [attr.y2]="e.y2" />
      @if (edgeGhost() === 'ship' && ghostShipImage(); as image) {
        <image class="ghost-road piece-art" [attr.href]="image" [attr.transform]="e.transform"
          [attr.x]="-e.length * shipLength * k() / 2" [attr.y]="-e.length * shipLength * k() / 4" [attr.width]="e.length * shipLength * k()" [attr.height]="e.length * shipLength * k() / 2" />
      } @else if (edgeGhost() === 'ship') {
        <use class="ghost-road" href="#ship" [attr.transform]="e.transform + ' scale(' + k() + ')'" [attr.fill]="ghostColor()" />
      } @else if (ghostRoadImage(); as image) {
        <image class="ghost-road piece-art" [attr.href]="image" [attr.transform]="e.transform"
          [attr.x]="-e.length / 2" [attr.y]="-e.height / 2" [attr.width]="e.length" [attr.height]="e.height" />
      } @else {
        <line class="ghost-road" [attr.x1]="e.x1" [attr.y1]="e.y1" [attr.x2]="e.x2" [attr.y2]="e.y2" [attr.stroke]="ghostColor()" />
      }
    </g>
  }

  @for (v of vertexSpots(); track v.id) {
    <g class="vertex-target" (click)="vertexPick.emit(v.id)">
      <circle class="hit" [attr.cx]="v.x" [attr.cy]="v.y" [attr.r]="S * 0.26" />
      <circle class="mark" [attr.cx]="v.x" [attr.cy]="v.y" [attr.r]="S * 0.13" />
      @if (ghost(); as kind) {
        @if (ghostBuildingImage(); as image) {
          <image class="ghost piece-art" [attr.href]="image"
            [attr.x]="v.x - ghostSize() / 2" [attr.y]="v.y - ghostSize() / 2"
            [attr.width]="ghostSize()" [attr.height]="ghostSize()" />
        } @else {
          <path
            class="ghost"
            [attr.transform]="'translate(' + v.x + ',' + v.y + ')'"
            [attr.fill]="ghostColor()"
            [attr.d]="kind === 'city' ? 'M-16,11 L16,11 L16,-4 L4,-4 L4,-10 L-6,-19 L-16,-10 Z' : 'M-10,9 L10,9 L10,-3 L0,-12 L-10,-3 Z'"
          />
        }
      }
    </g>
  }
</svg>

<div class="zoom" (pointerdown)="$event.stopPropagation()">
  <button type="button" class="small" title="Hineinzoomen" aria-label="Hineinzoomen" [disabled]="zoom() >= maxZoom" (click)="zoomBy(1.4)">+</button>
  <button type="button" class="small" title="Herauszoomen" aria-label="Herauszoomen" [disabled]="zoom() <= 1" (click)="zoomBy(1 / 1.4)">−</button>
  @if (zoom() > 1) {
    <button type="button" class="small" title="Ganzes Brett zeigen" aria-label="Ganzes Brett zeigen" (click)="resetZoom()">⤢</button>
  }
</div>

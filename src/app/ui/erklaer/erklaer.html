<div class="erklaer-buehne">
  @if (istSpiel(inhalt())) {
    @for (id of [spielId()]; track id) {
      <div class="erklaer-spiel"><app-game /></div>
    }
  }
  @if (szeneId(inhalt()); as id) {
    <app-erklaer-szene [szene]="id" [takt]="takt()" />
  }

  <app-hexblende [zu]="zu()" />

  @if (karte(); as k) {
    <div class="erklaer-karte" [class.outro]="k.art === 'outro'">
      <img class="insel" src="web/banner/papiercollage/island.png" alt="" />
      <div class="zeile">Neuland · {{ k.art === 'intro' ? 'Grundspiel erklärt' : 'Viel Spaß beim Spielen' }}</div>
      <h1>{{ k.titel }}</h1>
      @if (k.unter) {
        <div class="unter">{{ k.unter }}</div>
      }
    </div>
  }
</div>

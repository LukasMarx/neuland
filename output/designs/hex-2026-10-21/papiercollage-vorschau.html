<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuland · Papiercollage</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3ecdc; color: #2b2418; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1180px; margin: auto; padding: 36px 24px; }
  header { display: flex; gap: 20px; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font: 600 clamp(28px, 5vw, 44px)/1.2 Georgia, serif; }
  p { color: #7a6d55; margin: 10px 0; }
  label { white-space: nowrap; cursor: pointer; }
  input { accent-color: #b5502b; }
  #board { display: block; width: min(100%, 880px); margin: 16px auto 28px; }
  .outline { fill: none; stroke: #f3e7c6; stroke-width: 3; stroke-linejoin: round; }
  .number { text-anchor: middle; dominant-baseline: central; font: 700 19px system-ui, sans-serif; }
  .samples { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; }
  figure { margin: 0; text-align: center; }
  figure svg { width: 100%; display: block; }
  figcaption { font-weight: 600; margin-top: 8px; }
  .hide-chips .token { display: none; }
  @media(max-width: 700px) { header { align-items: start; flex-direction: column; } .samples { grid-template-columns: repeat(3, 1fr); } }
</style>
<main>
  <header>
    <div><h1>Neuland · Papiercollage</h1><p>Sechs Geländearten und ein Ozean aus türkisblauen Papierschichten.</p></div>
    <label><input id="chips" type="checkbox" checked> Zahlenchips anzeigen</label>
  </header>
  <svg id="board" viewBox="-340 -300 680 600" role="img" aria-label="Vorschau der Papiercollage auf einer Insel aus 19 Hexfeldern"></svg>
  <div class="samples" id="samples"></div>
</main>
<script>
  const terrains = [ ['wood', 'Wald'], ['brick', 'Lehm'], ['sheep', 'Weide'], ['wheat', 'Acker'], ['ore', 'Gebirge'], ['desert', 'Wüste'] ];
  const prefix = location.protocol === 'file:' ? '../../../public/' : '/';
  const points = '0,-60 51.96,-30 51.96,30 0,60 -51.96,30 -51.96,-30';
  const defs = `<defs>
    <clipPath id="hexclip"><polygon points="${points}"/></clipPath>

    <radialGradient id="ocean"><stop offset="0" stop-color="#4f97c4"/><stop offset="1" stop-color="#2f6f9c"/></radialGradient>
    <pattern id="p-ocean-paper" width="1" height="1" patternUnits="objectBoundingBox" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><image href="${prefix}tiles/papiercollage/ocean.png" width="100" height="100" preserveAspectRatio="xMidYMid slice"/></pattern>
  </defs>`;
  function tile(terrain, number, x, y) {
    const red = number === 6 || number === 8;
    const ink = red ? '#c0281f' : '#2b2418';
    const pips = number ? 6 - Math.abs(7-number) : 0;
    return `<g transform="translate(${x},${y})">
      <image href="${prefix}tiles/papiercollage/${terrain}.png" x="-51.96" y="-60" width="103.92" height="120" preserveAspectRatio="xMidYMid slice" clip-path="url(#hexclip)"/>

      <polygon class="outline" points="${points}"/>
      ${number ? `<g class="token"><circle cx="1.5" cy="5.5" r="18" fill="#000" opacity="0.28"/><circle cy="3" r="18" fill="url(#g-token)" stroke="#8a7550" stroke-width="1.2"/><circle cy="3" r="15" fill="none" stroke="#c9b385" stroke-width="0.8"/><text class="number" y="3" fill="${ink}">${number}</text>${Array.from({length:pips}, (_,p) => `<circle cx="${(p-(pips-1)/2)*4.5}" cy="13.8" r="1.32" fill="${ink}"/>`).join('')}</g>` : ''}
    </g>`;
  }

  const board = fixtures[new URLSearchParams(location.search).get('layout') === 'ext' ? 'ext' : 'base'];
  const cells = board.hexes.map(h => tile(h.terrain,h.number,h.x,h.y)).join('');
  const icons = {any:'?',wood:'🌲',brick:'🧱',sheep:'🐑',wheat:'🌾',ore:'🪨'};
  const harbors = board.harbors.map(h => `<g><line x1="${h.x}" y1="${h.y}" x2="${h.ax}" y2="${h.ay}" stroke="#8a6a3e" stroke-width="4" stroke-linecap="round"/><line x1="${h.x}" y1="${h.y}" x2="${h.bx}" y2="${h.by}" stroke="#8a6a3e" stroke-width="4" stroke-linecap="round"/><circle cx="${h.x}" cy="${h.y}" r="18" fill="#fbf4e2" stroke="#8a6a3e" stroke-width="2"/><text x="${h.x}" y="${h.y-3.6}" text-anchor="middle" dominant-baseline="central" font-size="13">${icons[h.type]}</text><text x="${h.x}" y="${h.y+10.2}" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="700" fill="#5b4527">${h.type==='any'?'3:1':'2:1'}</text></g>`).join('');
  const boardElement = document.getElementById('board');
  boardElement.setAttribute('viewBox',board.viewBox);
  boardElement.setAttribute('aria-label','Papiercollage-Insel mit '+board.hexes.length+' Hexfeldern und Häfen');
  boardElement.innerHTML = defs + `<path d="${board.ocean}" fill="url(#ocean)" stroke="#28627f" stroke-width="6" stroke-linejoin="round"/><path d="${board.ocean}" fill="url(#p-ocean-paper)"/>` + harbors + cells;
  document.getElementById('samples').innerHTML = terrains.map(([key,label]) => `<figure><svg viewBox="-55 -63 110 126" role="img" aria-label="${label}">${tile(key,null,0,0)}</svg><figcaption>${label}</figcaption></figure>`).join('');
  document.getElementById('chips').addEventListener('change', e => document.body.classList.toggle('hide-chips', !e.target.checked));
</script>
</html>

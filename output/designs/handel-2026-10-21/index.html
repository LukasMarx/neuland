<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuland · Prototyp Tauschtisch</title>
<link rel="stylesheet" href="../ui-2026-10-21/shared/board.css">
<style>
  /* Grundlage ist Entwurf 02b. Neu ist nur der Tauschtisch im Dock und die Angebotskarte rechts. */
  :root {
    --bg: #121c24;
    --surface: #18242e;
    --surface-2: #1e2c37;
    --line: #2a3a46;
    --text: #e8e2d6;
    --muted: #8d9aa4;
    --accent: #d4b06a;
    --accent-ink: #1b1508;
    --ok: #5fb57a;
    --bad: #d26a5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Nunito Sans', sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    font-size: 14px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }

  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    grid-template-rows: 68px minmax(0, 1fr) 180px;
    height: 100vh;
    transition: grid-template-rows 0.25s ease;
  }
  .stage.trading { grid-template-rows: 68px minmax(0, 1fr) 214px; }

  /* --- Kopf --- */
  .top {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 240px 1fr 240px;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--line);
  }
  .brand { white-space: nowrap; }
  .brand b { font-size: 17px; font-weight: 800; }
  .brand span { margin-left: 10px; font-size: 13px; color: var(--muted); }
  .players { display: flex; justify-content: center; gap: 6px; }
  .player { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 10px; position: relative; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--c);
    display: grid; place-items: center; overflow: hidden; flex: none;
  }
  .avatar img { width: 78%; margin-top: 4px; }
  .who { display: grid; line-height: 1.2; }
  .who b { font-weight: 700; }
  .who small { color: var(--muted); font-size: 12px; }
  .vp { font-size: 20px; font-weight: 800; margin-left: 4px; }
  .player.active { background: var(--surface-2); }
  .player.active::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -12px; height: 2px; border-radius: 2px; background: var(--accent); }
  .player.active .who small { color: var(--accent); }
  .scenario { display: flex; justify-content: flex-end; gap: 4px; }
  .scenario button {
    height: 30px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; font-weight: 700;
  }
  .scenario button.on { color: var(--text); border-color: var(--accent); }

  /* --- Brett --- */
  .board-area { position: relative; }
  .board-area .nl-board-host { position: absolute; inset: 48px 32px 12px 112px; }
  .status {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
    font-weight: 600; white-space: nowrap; z-index: 2;
  }
  .status b { color: var(--accent); font-weight: 800; }
  .bank {
    position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
    display: grid; gap: 6px; padding: 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
  }
  .bank small { color: var(--muted); font-size: 11px; font-weight: 700; }
  .bank div { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .bank img { width: 20px; height: 30px; border-radius: 3px; object-fit: cover; }
  .toast {
    position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 12px);
    padding: 9px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
    font-weight: 700; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 3;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* --- Seitenleiste --- */
  .side {
    grid-row: 2; grid-column: 2; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 14px 18px 18px; gap: 16px; min-height: 0;
  }
  .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); }
  .tabs span { padding: 6px 0 9px; color: var(--muted); font-weight: 600; }
  .tabs .on { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; overflow: auto; align-content: start; }
  .log li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; line-height: 1.4; }
  .log li::before { content: ''; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--c); }
  .log .mini-row { display: flex; gap: 3px; margin-top: 4px; align-items: center; }
  .log .mini-row img { width: 16px; height: 24px; border-radius: 2px; object-fit: cover; }
  .log .mini-row span { color: var(--muted); padding: 0 3px; }

  /* Eingehendes Angebot */
  .incoming {
    margin-top: auto; padding: 14px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--c);
    display: grid; gap: 10px;
  }
  .incoming.enter { animation: rise 0.25s ease-out; }
  .incoming p { margin: 0; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .incoming p span { color: var(--muted); font-weight: 400; }
  .incoming .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .terms { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .terms small { color: var(--muted); font-size: 12px; }
  .stack { display: flex; gap: 3px; flex-wrap: wrap; }
  .stack img { width: 26px; height: 39px; border-radius: 3px; object-fit: cover; box-shadow: 0 2px 4px rgb(0 0 0 / 0.3); }
  .incoming .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .incoming .note { color: var(--muted); font-size: 12px; margin: 0; }

  .btn {
    height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font-weight: 700; font-size: 13px; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 800; }
  .btn:disabled { opacity: 0.4; }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12px; }

  /* --- Dock --- */
  .dock {
    grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: 28px; padding: 0 24px; background: var(--surface); border-top: 1px solid var(--line);
    position: relative;
  }
  .hand { display: flex; gap: 10px; align-items: flex-end; margin-top: -34px; }
  .card {
    position: relative; width: 82px; height: 123px; border-radius: 9px; padding: 0; border: none; background: none;
    box-shadow: 0 6px 14px rgb(0 0 0 / 0.35); transition: transform 0.15s;
  }
  .card img { width: 100%; height: 100%; border-radius: 9px; object-fit: cover; display: block; }
  .card .name {
    position: absolute; left: 6px; right: 6px; bottom: 7px; text-align: center; padding: 2px 0; border-radius: 5px;
    font-weight: 900; font-size: 12px; color: #2b2418; background: linear-gradient(#fffaf0, #efe0c0);
  }
  .card .n {
    position: absolute; top: -9px; right: -7px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px;
    display: grid; place-items: center; background: var(--text); color: var(--bg); font-weight: 800; font-size: 13px;
  }
  .card .out {
    position: absolute; top: -9px; left: -7px; height: 22px; padding: 0 7px; border-radius: 11px;
    display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 900; font-size: 12px;
  }
  .card.zero { opacity: 0.35; filter: grayscale(0.7); }
  .card.dev { width: 70px; height: 105px; }
  .trading .card:not(.zero):not(.dev):not(.spent):hover { transform: translateY(-6px); }
  .card.spent { opacity: 0.55; }
  .sep { width: 1px; align-self: stretch; margin: 16px 6px 0; background: var(--line); }

  .build { display: grid; grid-template-columns: repeat(3, minmax(0, 160px)); gap: 8px; justify-content: center; align-self: center; }
  .build button {
    display: grid; grid-template-columns: 30px auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center;
    text-align: left; padding: 8px 12px 8px 8px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface-2); font-weight: 700; font-size: 13px;
  }
  .build button:hover { border-color: var(--accent); }
  .build .p { grid-row: 1 / 3; width: 30px; height: 30px; object-fit: contain; }
  .build .p.road { height: 9px; }
  .build .cost { display: flex; gap: 2px; }
  .build .cost img { width: 10px; height: 15px; border-radius: 2px; object-fit: cover; }
  .build .cost.text { color: var(--muted); font-size: 11px; font-weight: 600; }
  .build kbd { font: 600 10px 'Nunito Sans', sans-serif; color: var(--muted); margin-left: 6px; }

  .turn { display: flex; align-items: center; gap: 16px; }
  .die { width: 44px; height: 44px; border-radius: 9px; background: #f4ecdc; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; }
  .die i { width: 8px; height: 8px; border-radius: 50%; background: #2b2418; place-self: center; }
  .dice { display: flex; gap: 8px; align-items: center; }
  .go { height: 52px; padding: 0 26px; border-radius: 10px; border: none; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 16px; }

  /* --- Tauschtisch --- */
  .table {
    display: grid; grid-template-columns: auto minmax(220px, 1fr); gap: 22px; align-items: center;
  }
  .table.enter { animation: rise 0.22s ease-out; }
  .rows { display: grid; gap: 10px; }
  .trow { display: grid; grid-template-columns: 92px auto; align-items: center; gap: 10px; }
  .trow > b { font-size: 13px; }
  .trow > b small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; }
  .slots { display: flex; gap: 8px; }
  .slot {
    position: relative; width: 50px; height: 75px; padding: 0; border-radius: 7px;
    border: 1px solid var(--line); background: var(--surface-2); overflow: visible;
  }
  .slot img { width: 100%; height: 100%; border-radius: 6px; object-fit: cover; display: block; opacity: 0.42; filter: grayscale(0.5); transition: opacity 0.12s, filter 0.12s; }
  .slot.on img { opacity: 1; filter: none; }
  .slot.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .slot:hover:not(:disabled) img { opacity: 0.75; filter: none; }
  .slot.on:hover:not(:disabled) img { opacity: 1; }
  .slot:disabled { opacity: 0.45; }
  .slot .cnt {
    position: absolute; top: -8px; right: -8px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px;
    display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 900; font-size: 12px;
  }
  .slot .minus {
    position: absolute; top: -8px; left: -8px;
    width: 22px; height: 22px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface);
    display: grid; place-items: center; font-size: 13px; font-weight: 900; line-height: 1; padding: 0;
  }
  .slot .rate {
    position: absolute; bottom: 3px; left: 3px; right: 3px; text-align: center; border-radius: 4px;
    font-size: 10px; font-weight: 900; color: #2b2418; background: rgb(255 248 232 / 0.92);
  }
  .slot .rate.good { background: var(--accent); }
  .arrow { color: var(--muted); font-size: 18px; text-align: center; width: 92px; }

  .act { display: grid; gap: 10px; align-content: center; }
  .hint { margin: 0; color: var(--muted); line-height: 1.4; min-height: 2.8em; }
  .hint b { color: var(--text); }
  .hint.good b { color: var(--accent); }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .close {
    position: absolute; top: 10px; right: 14px; width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }

  .answers { display: grid; gap: 6px; }
  .answer {
    display: grid; grid-template-columns: 10px auto 1fr auto; align-items: center; gap: 8px;
    padding: 6px 8px 6px 10px; border-radius: 8px; background: var(--surface-2); min-height: 40px;
  }
  .answer .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .answer .state { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .answer .state.ok { color: var(--ok); font-weight: 700; }
  .answer .state.bad { color: var(--bad); }
  .answer .stack img { width: 18px; height: 27px; }
  .wait::after { content: ' …'; animation: blink 1s steps(2) infinite; }

  .legend {
    position: fixed; left: 24px; bottom: calc(var(--dock, 180px) + 8px); max-width: 360px;
    color: var(--muted); font-size: 11px; opacity: 0.75;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes blink { 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header class="top">
    <div class="brand"><b>Neuland</b><span>Prototyp Tauschtisch</span></div>
    <div class="players" id="players"></div>
    <div class="scenario" id="scenario">
      <button data-s="mine" class="on">Ich bin am Zug</button>
      <button data-s="incoming">Mira ist am Zug</button>
    </div>
  </header>

  <main class="board-area">
    <div class="status" id="status"></div>
    <div class="bank" id="bank"></div>
    <div class="nl-board-host" id="board"></div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="side">
    <div class="tabs"><span class="on">Verlauf</span><span>Chat</span></div>
    <ul class="log" id="log"></ul>
    <div id="incoming"></div>
  </aside>

  <section class="dock" id="dock"></section>
</div>

<script type="module">
  import { renderBoard } from '../ui-2026-10-21/shared/board.js';
  renderBoard(document.getElementById('board'), { highlight: 8 });

  const A = '../../../public/web/';
  const CARD = (r) => `${A}cards/symbolstark/${r}.jpg`;
  const PIECE = (k, c) => `${A}pieces/papiercollage/${k}-${c}.png`;
  const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
  const NAME = { wood: 'Holz', brick: 'Lehm', sheep: 'Wolle', wheat: 'Getreide', ore: 'Erz' };
  // Lukas hat einen 3:1-Hafen und einen Wollhafen.
  const RATE = { wood: 3, brick: 3, sheep: 2, wheat: 3, ore: 3 };
  const PLAYERS = [
    { name: 'Mira', color: '#2f64d6', piece: 'blue', vp: 4 },
    { name: 'Lukas', color: '#d23c3c', piece: 'red', vp: 5, me: true },
    { name: 'Paul', color: '#ee8a1c', piece: 'orange', vp: 5 },
    { name: 'Jana', color: '#f4f1e8', piece: 'white', vp: 3 },
  ];
  const others = () => PLAYERS.filter((p) => !p.me);
  const player = (name) => PLAYERS.find((p) => p.name === name);

  const zero = () => ({ wood: 0, brick: 0, sheep: 0, wheat: 0, ore: 0 });
  const sum = (c) => RES.reduce((n, r) => n + c[r], 0);
  const cards = (c) => RES.flatMap((r) => Array(c[r]).fill(r));
  const stack = (c) => `<span class="stack">${cards(c).map((r) => `<img src="${CARD(r)}" alt="${NAME[r]}" title="${NAME[r]}">`).join('')}</span>`;
  const words = (c) => RES.filter((r) => c[r]).map((r) => `${c[r]} ${NAME[r]}`).join(', ');

  const START_HAND = { wood: 4, brick: 1, sheep: 3, wheat: 2, ore: 0 };
  const START_BANK = { wood: 14, brick: 16, sheep: 15, wheat: 12, ore: 17 };
  const START_LOG = [
    { c: '#d23c3c', html: 'Lukas würfelt 8' },
    { c: '#ee8a1c', html: 'Paul hat jetzt die längste Straße' },
    { c: '#2f64d6', html: 'Mira baut eine Straße' },
  ];
  const state = {
    scenario: 'mine',
    hand: { ...START_HAND },
    bank: { ...START_BANK },
    trading: false,
    mode: 'compose', // compose | waiting | counter
    give: zero(),
    want: zero(),
    answers: {},
    incoming: null,
    log: [...START_LOG],
  };
  let timers = [];
  // Neu aufgebaute Teile spielen ihren Auftritt nur beim ersten Erscheinen.
  let shownTable = false;
  let shownIncoming = null;
  const later = (ms, fn) => timers.push(setTimeout(() => { fn(); render(); }, ms));
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

  /** Bewertet das Angebot aus Sicht der Bank: Welcher Rohstoff passt nicht zum Kurs, wie viele Karten gäbe es? */
  function bankCheck() {
    const g = state.give, w = state.want;
    let lots = 0;
    const off = [];
    for (const r of RES) {
      if (!g[r]) continue;
      const rest = g[r] % RATE[r];
      if (rest) off.push({ r, rest, add: RATE[r] - rest });
      else lots += g[r] / RATE[r];
    }
    const overlap = RES.some((r) => g[r] && w[r]);
    const ok = !overlap && !off.length && lots > 0 && sum(w) === lots;
    return { lots, off, overlap, ok };
  }

  function hint() {
    const g = sum(state.give), w = sum(state.want);
    if (state.mode === 'counter') {
      return g && w ? { text: `Mira bekommt <b>${words(state.give)}</b> und gibt dir <b>${words(state.want)}</b>.` }
        : { text: 'Ändere das Angebot, bis es dir passt. Klick auf eine Karte legt eine dazu, <b>−</b> nimmt eine weg.' };
    }
    if (!g && !w) return { text: 'Klick auf deine Handkarten oder auf die Karten hier, um ein Angebot zusammenzustellen.' };
    const b = bankCheck();
    if (b.overlap) return { text: 'Ein Rohstoff kann nicht auf beiden Seiten liegen.' };
    if (b.ok) return { good: true, text: `<b>Passt für die Bank:</b> ${words(state.give)} gegen ${words(state.want)}. Mitspieler kannst du trotzdem fragen.` };
    if (!g) return { text: `Lege noch fest, was du dafür gibst.` };
    if (b.off.length) {
      const o = b.off[0];
      const canAdd = state.hand[o.r] - state.give[o.r] >= o.add;
      const fix = canAdd ? `${o.add} ${NAME[o.r]} mehr` : `${o.rest} ${NAME[o.r]} weniger`;
      return { text: `Bank und Häfen tauschen ${NAME[o.r]} <b>${RATE[o.r]}:1</b>. Mit ${fix} ginge es über die Bank.${w ? ' An Mitspieler kannst du es so anbieten.' : ''}` };
    }
    if (w < b.lots) return { text: `Die Bank gibt dir dafür <b>${b.lots} ${b.lots === 1 ? 'Karte' : 'Karten'}</b>. Wähle noch ${b.lots - w} aus, die du bekommst.` };
    return { text: `Für die Bank ist das zu viel gewünscht, sie gibt nur ${b.lots}. An Mitspieler kannst du es so anbieten.` };
  }

  function render() {
    const stage = document.getElementById('stage');
    stage.classList.toggle('trading', state.trading);
    document.documentElement.style.setProperty('--dock', state.trading ? '214px' : '180px');
    const current = state.scenario === 'mine' ? 'Lukas' : 'Mira';

    document.getElementById('players').innerHTML = PLAYERS.map((p) => `
      <div class="player ${p.name === current ? 'active' : ''}" style="--c:${p.color}">
        <span class="avatar"><img src="${PIECE('knight', p.piece)}" alt=""></span>
        <span class="who"><b>${p.name}${p.me ? ' (du)' : ''}</b><small>${p.name === current ? 'am Zug' : (p.me ? sum(state.hand) : 5) + ' Karten'}</small></span>
        <span class="vp">${p.vp}</span>
      </div>`).join('');

    document.getElementById('status').innerHTML = state.scenario === 'mine'
      ? (state.trading ? '<b>Handeln</b> · Angebot zusammenstellen' : '<b>Du bist dran</b> · Handeln und bauen')
      : 'Mira ist am Zug';
    document.getElementById('bank').innerHTML = '<small>Bank</small>' +
      RES.map((r) => `<div><img src="${CARD(r)}" alt="">${state.bank[r]}</div>`).join('') +
      `<div><img src="${CARD('back')}" alt="">19</div>`;
    document.getElementById('log').innerHTML = state.log.map((e) => `<li style="--c:${e.c}"><div>${e.html}</div></li>`).join('');

    renderIncoming();
    renderDock();
  }

  function renderIncoming() {
    const host = document.getElementById('incoming');
    const o = state.incoming;
    if (!o) { host.innerHTML = ''; shownIncoming = null; return; }
    const p = player(o.from);
    host.innerHTML = `
      <div class="incoming ${shownIncoming === o ? '' : 'enter'}" style="--c:${p.color}">
        <p><span class="dot"></span>${p.name} <span>${o.sent ? 'prüft dein Gegenangebot' : 'sucht einen Tausch'}</span></p>
        <div class="terms">
          <small>gibt</small>${stack(o.give)}
          <small>will</small>${stack(o.want)}
        </div>
        ${o.sent
          ? `<p class="note wait">Gegenangebot geschickt, ${p.name} entscheidet</p>`
          : `<div class="row">
              <button class="btn primary small" data-act="accept-in" ${canPay(o.want) ? '' : 'disabled'}>Annehmen</button>
              <button class="btn small" data-act="counter">Gegenangebot</button>
              <button class="btn small" data-act="decline-in">Ablehnen</button>
            </div>
            ${canPay(o.want) ? '' : `<p class="note">Dir fehlt etwas dafür. Mach ein Gegenangebot.</p>`}`}
      </div>`;
    shownIncoming = o;
  }

  const canPay = (c) => RES.every((r) => state.hand[r] >= c[r]);

  function handHtml() {
    return RES.map((r) => {
      const n = state.hand[r];
      const out = state.trading ? state.give[r] : 0;
      const spent = out >= n && n > 0;
      return `<button class="card ${n ? '' : 'zero'} ${spent ? 'spent' : ''}" data-hand="${r}" title="${NAME[r]}: ${n}${state.trading ? ' · Klick legt eine Karte auf „Du gibst“' : ''}">
        <img src="${CARD(r)}" alt=""><span class="name">${NAME[r]}</span><span class="n">${n}</span>
        ${out ? `<span class="out">−${out}</span>` : ''}
      </button>`;
    }).join('') + `<span class="sep"></span><div class="card dev"><img src="${CARD('knight')}" alt=""><span class="name">Ritter</span></div>`;
  }

  function slotRow(side) {
    const counts = state[side];
    const locked = state.mode === 'waiting';
    return RES.map((r) => {
      const n = counts[r];
      const max = side === 'give' ? state.hand[r] : state.bank[r];
      const full = n >= max;
      const rate = side === 'give' && state.mode !== 'counter' ? `<span class="rate ${RATE[r] === 2 ? 'good' : ''}">${RATE[r]}:1</span>` : '';
      return `<button class="slot ${n ? 'on' : ''}" data-slot="${side}:${r}" ${locked || (full && !n) ? 'disabled' : ''}
          title="${NAME[r]}${side === 'give' ? ` · du hast ${state.hand[r]}` : ''}">
        <img src="${CARD(r)}" alt="${NAME[r]}">
        ${rate}
        ${n ? `<span class="cnt">${n}</span>` : ''}
        ${n && !locked ? `<span class="minus" data-minus="${side}:${r}" title="Eine weniger">−</span>` : ''}
      </button>`;
    }).join('');
  }

  function renderDock() {
    const dock = document.getElementById('dock');
    if (!state.trading) {
      shownTable = false;
      const mine = state.scenario === 'mine';
      dock.innerHTML = `
        <div class="hand">${handHtml()}</div>
        <div class="build">
          <button><img class="p road" src="${PIECE('road', 'red')}" alt="">Straße<span class="cost"><img src="${CARD('wood')}"><img src="${CARD('brick')}"></span></button>
          <button><img class="p" src="${PIECE('settlement', 'red')}" alt="">Siedlung<span class="cost"><img src="${CARD('wood')}"><img src="${CARD('brick')}"><img src="${CARD('sheep')}"><img src="${CARD('wheat')}"></span></button>
          <button ${mine ? '' : 'disabled style="opacity:.4"'} data-act="open"><span class="p" style="display:grid;place-items:center;color:var(--muted);font-size:18px">⇄</span><span>Handeln<kbd>H</kbd></span><span class="cost text">${mine ? 'Bank oder Spieler' : 'nur wer am Zug ist'}</span></button>
        </div>
        <div class="turn">
          <div class="dice">
            <div class="die"><i style="grid-area:1/1"></i><i style="grid-area:1/3"></i><i style="grid-area:2/2"></i><i style="grid-area:3/1"></i><i style="grid-area:3/3"></i></div>
            <div class="die"><i style="grid-area:1/3"></i><i style="grid-area:2/2"></i><i style="grid-area:3/1"></i></div>
          </div>
          <button class="go" ${mine ? '' : 'disabled style="opacity:.4"'}>${mine ? 'Zug beenden' : 'Warte auf Mira'}</button>
        </div>`;
      return;
    }

    const h = hint();
    const b = bankCheck();
    const g = sum(state.give), w = sum(state.want);
    const offerable = g > 0 && w > 0 && !b.overlap;
    let act;
    if (state.mode === 'waiting') {
      act = `<div class="answers">${others().map((p) => answerRow(p)).join('')}</div>
        <div class="buttons"><button class="btn" data-act="withdraw">Zurückziehen</button></div>`;
    } else if (state.mode === 'counter') {
      act = `<p class="hint">${h.text}</p>
        <div class="buttons">
          <button class="btn primary" data-act="send-counter" ${offerable ? '' : 'disabled'}>Gegenangebot an Mira</button>
          <button class="btn" data-act="close">Abbrechen</button>
        </div>`;
    } else {
      act = `<p class="hint ${h.good ? 'good' : ''}">${h.text}</p>
        <div class="buttons">
          <button class="btn ${b.ok ? 'primary' : ''}" data-act="bank" ${b.ok ? '' : 'disabled'}>Mit der Bank tauschen</button>
          <button class="btn ${b.ok ? '' : 'primary'}" data-act="offer" ${offerable ? '' : 'disabled'}>Allen anbieten</button>
          <button class="btn" data-act="clear" ${g || w ? '' : 'disabled'}>Leeren</button>
        </div>`;
    }
    dock.innerHTML = `
      <div class="hand">${handHtml()}</div>
      <div class="table ${shownTable ? '' : 'enter'}">
        <div class="rows">
          <div class="trow"><b>Du gibst<small>${state.mode === 'counter' ? 'an Mira' : 'aus deiner Hand'}</small></b><div class="slots">${slotRow('give')}</div></div>
          <div class="trow"><b>Du bekommst<small>${state.mode === 'counter' ? 'von Mira' : 'von Bank oder Mitspielern'}</small></b><div class="slots">${slotRow('want')}</div></div>
        </div>
        <div class="act">${act}</div>
      </div>
      <button class="close" data-act="close" title="Schließen (Esc)">✕</button>`;
    shownTable = true;
  }

  function answerRow(p) {
    const a = state.answers[p.name];
    let state_ = '<span class="state wait">überlegt</span>';
    let btn = '';
    if (a === 'accept') {
      state_ = '<span class="state ok">nimmt an</span>';
      btn = `<button class="btn primary small" data-deal="${p.name}">Tauschen</button>`;
    } else if (a === 'decline') {
      state_ = '<span class="state bad">lehnt ab</span>';
    } else if (a && a.counter) {
      state_ = `<span class="state">gibt ${stack(a.counter.give)} für ${stack(a.counter.want)}</span>`;
      btn = `<button class="btn small" data-deal="${p.name}" ${canPay(a.counter.want) ? '' : 'disabled'}>Annehmen</button>`;
    }
    return `<div class="answer" style="--c:${p.color}"><span class="dot"></span><b>${p.name}</b>${state_}${btn}</div>`;
  }

  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function apply(give, get, who) {
    for (const r of RES) {
      state.hand[r] += get[r] - give[r];
      if (who === 'Bank') state.bank[r] += give[r] - get[r];
    }
    const c = who === 'Bank' ? '#d23c3c' : player(who).color;
    state.log.unshift({ c, html: `Lukas tauscht mit ${who === 'Bank' ? 'der Bank' : who}<div class="mini-row">${cards(give).map((r) => `<img src="${CARD(r)}">`).join('')}<span>→</span>${cards(get).map((r) => `<img src="${CARD(r)}">`).join('')}</div>` });
  }

  function resetTable() {
    clearTimers();
    state.give = zero();
    state.want = zero();
    state.answers = {};
    state.mode = 'compose';
  }

  function open() {
    if (state.scenario !== 'mine') return;
    state.trading = true;
  }

  function close() {
    resetTable();
    state.trading = false;
    if (state.incoming && !state.incoming.sent) state.incoming.countering = false;
  }

  function bump(side, r, d) {
    const max = side === 'give' ? state.hand[r] : state.bank[r];
    state[side][r] = Math.max(0, Math.min(max, state[side][r] + d));
    // Ein Rohstoff liegt nur auf einer Seite: wer ihn auf die andere legt, nimmt ihn hier weg.
    const other = side === 'give' ? 'want' : 'give';
    if (d > 0 && state[other][r]) state[other][r] = 0;
  }

  function sendOffer() {
    state.mode = 'waiting';
    state.answers = {};
    const give = { ...state.give }, want = { ...state.want };
    later(900, () => { state.answers.Mira = 'accept'; });
    later(1600, () => { state.answers.Paul = 'decline'; });
    later(2500, () => {
      // Jana will für dasselbe eine Karte mehr, und zwar eine, die du hast.
      const extra = RES.find((x) => !want[x] && state.hand[x] > give[x]) ?? 'wood';
      state.answers.Jana = { counter: { give: { ...want }, want: { ...give, [extra]: give[extra] + 1 } } };
    });
  }

  function deal(name) {
    const a = state.answers[name];
    if (a === 'accept') apply(state.give, state.want, name);
    else if (a?.counter) apply(a.counter.want, a.counter.give, name);
    toast(`Getauscht mit ${name}`);
    resetTable();
  }

  function setScenario(s) {
    close();
    state.scenario = s;
    state.hand = { ...START_HAND };
    state.bank = { ...START_BANK };
    state.log = [...START_LOG];
    state.incoming = s === 'incoming'
      ? { from: 'Mira', give: { ...zero(), ore: 1 }, want: { ...zero(), wood: 2, brick: 1 } }
      : null;
    document.querySelectorAll('#scenario button').forEach((b) => b.classList.toggle('on', b.dataset.s === s));
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act], [data-slot], [data-minus], [data-hand], [data-deal], [data-s]');
    if (!t) return;
    if (t.dataset.s) setScenario(t.dataset.s);
    else if (t.dataset.minus) {
      e.stopPropagation();
      const [side, r] = t.dataset.minus.split(':');
      bump(side, r, -1);
    } else if (t.dataset.slot) {
      const [side, r] = t.dataset.slot.split(':');
      bump(side, r, 1);
    } else if (t.dataset.hand) {
      const r = t.dataset.hand;
      if (!state.hand[r]) return;
      if (!state.trading) open();
      if (state.trading && state.mode !== 'waiting') bump('give', r, 1);
    } else if (t.dataset.deal) deal(t.dataset.deal);
    else {
      const act = t.dataset.act;
      if (act === 'open') open();
      if (act === 'close') close();
      if (act === 'clear') resetTable();
      if (act === 'offer') sendOffer();
      if (act === 'withdraw') { resetTable(); toast('Angebot zurückgezogen'); }
      if (act === 'bank') { apply(state.give, state.want, 'Bank'); toast('Mit der Bank getauscht'); resetTable(); }
      if (act === 'accept-in') {
        const o = state.incoming;
        apply(o.want, o.give, 'Mira');
        state.incoming = null;
        toast('Getauscht mit Mira');
      }
      if (act === 'decline-in') { state.incoming = null; toast('Abgelehnt'); }
      if (act === 'counter') {
        // Gegenangebot startet gespiegelt: was Mira will, gibst du; was sie gibt, bekommst du.
        const o = state.incoming;
        state.trading = true;
        state.mode = 'counter';
        state.give = RES.reduce((c, r) => ({ ...c, [r]: Math.min(o.want[r], state.hand[r]) }), zero());
        state.want = { ...o.give };
      }
      if (act === 'send-counter') {
        const o = state.incoming;
        o.sent = true;
        const give = { ...state.give }, want = { ...state.want };
        o.give = want;
        o.want = give;
        state.trading = false;
        resetTable();
        later(1800, () => {
          apply(give, want, 'Mira');
          state.incoming = null;
          toast('Mira nimmt dein Gegenangebot an');
        });
      }
    }
    render();
  });

  document.addEventListener('contextmenu', (e) => {
    // Rechtsklick nimmt eine Karte weg, wie das kleine Minus.
    const t = e.target.closest('[data-slot], [data-hand]');
    if (!t || !state.trading || state.mode === 'waiting') return;
    e.preventDefault();
    if (t.dataset.slot) { const [side, r] = t.dataset.slot.split(':'); bump(side, r, -1); }
    else bump('give', t.dataset.hand, -1);
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.trading) { close(); render(); }
    if ((e.key === 'h' || e.key === 'H') && !state.trading) { open(); render(); }
  });

  render();
</script>
</body>
</html>

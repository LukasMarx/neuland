<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuland · Banner-Prototyp</title>
<link rel="stylesheet" href="../../../public/fonts/nunito-sans/fonts.css">
<style>
  :root { --bg: #121c24; --panel: #18242e; --line: #2a3a46; --text: #e8e2d6; --muted: #8d9aa4; --accent: #d4b06a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito Sans', sans-serif; }
  header { padding: 28px 36px 0; }
  header h1 { margin: 0 0 6px; font-size: 26px; font-weight: 900; }
  header p { margin: 0; color: var(--muted); max-width: 820px; line-height: 1.45; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 36px; }
  .controls button {
    height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
    background: #1e2c37; color: var(--text); font: 700 13px 'Nunito Sans', sans-serif; cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); }
  .controls button.loop { margin-left: auto; color: var(--muted); }

  /* Bühne mit angedeutetem Spielfeld im Hintergrund */
  .stage {
    position: relative;
    margin: 0 36px 36px;
    height: 560px;
    border-radius: 16px;
    border: 1px solid var(--line);
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 55%, rgb(0 0 0 / 0) 35%, rgb(0 0 0 / 0.45)),
      url('../../../public/web/tiles/papiercollage/ocean.jpg') center / 420px;
    perspective: 1200px;
  }
  .stage::after { content: ''; position: absolute; inset: 0; background: rgb(18 28 36 / 0.35); pointer-events: none; }

  /* --- Das Banner: eine Karte im Querformat --- */
  .banner {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 2;
    width: min(620px, calc(100% - 48px));
    aspect-ratio: 620 / 236;
    margin: 0;
    translate: -50% -50%;
    border-radius: 16px;
    overflow: hidden;
    background: #235563 var(--art) var(--pos, center 38%) / cover no-repeat;
    box-shadow:
      0 0 0 3px #f6e5bd,
      0 0 0 5px rgb(120 92 52 / 0.9),
      0 26px 60px rgb(0 0 0 / 0.55);
    transform-style: preserve-3d;
    animation: banner-in 0.9s cubic-bezier(0.2, 1.3, 0.35, 1) both, banner-out 0.55s ease-in 3.2s forwards;
  }
  /* Abdunklung unten, damit das Schild ruhig sitzt */
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgb(0 0 0 / 0) 35%, rgb(0 0 0 / 0.45));
  }
  /* Lichtschimmer, der einmal über die Karte läuft */
  .banner::after {
    content: '';
    position: absolute;
    inset: -20% -60%;
    background: linear-gradient(105deg, transparent 42%, rgb(255 248 225 / 0.55) 50%, transparent 58%);
    transform: translateX(-70%);
    animation: shine 1.1s ease-out 0.55s forwards;
  }
  .plate {
    position: absolute;
    left: 50%;
    bottom: 9%;
    z-index: 1;
    translate: -50% 0;
    min-width: 62%;
    padding: 10px 26px 11px;
    border: 1px solid #f6e5bd;
    border-radius: 12px;
    background: linear-gradient(140deg, #fff5df, #ead6ab);
    box-shadow: 0 4px 10px rgb(37 24 12 / 0.35);
    color: #302312;
    text-align: center;
    animation: plate-in 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) 0.35s both;
  }
  .plate b { display: block; font-size: 28px; font-weight: 900; line-height: 1.1; letter-spacing: -0.01em; }
  .plate span { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 15px; font-weight: 800; color: #5b4527; }
  .plate i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px rgb(0 0 0 / 0.45); }
  .plate em {
    font-style: normal;
    font-size: 13px;
    font-weight: 900;
    color: #fff5df;
    background: #54334b;
    border-radius: 999px;
    padding: 1px 9px;
  }
  /* Abzeichen oben links wie die Zahl auf den Handkarten */
  .seal {
    position: absolute;
    top: 7%;
    left: 4%;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 54px;
    height: 62px;
    background: #fff1d5;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    font-size: 26px;
    font-weight: 900;
    color: #302312;
    animation: seal-in 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) 0.6s both;
  }

  .banner.win { width: min(700px, calc(100% - 48px)); }
  .banner.win .plate b { font-size: 34px; }

  @keyframes banner-in {
    0% { opacity: 0; transform: translateY(-60px) rotateX(70deg) scale(0.7); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  @keyframes banner-out {
    to { opacity: 0; transform: translateY(-30px) scale(0.94); }
  }
  @keyframes shine {
    to { transform: translateX(70%); }
  }
  @keyframes plate-in {
    from { opacity: 0; transform: translateY(14px) scale(0.9); }
  }
  @keyframes seal-in {
    from { opacity: 0; transform: scale(0.2) rotate(-25deg); }
  }

  /* Konfetti nur beim Sieg */
  .confetti { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .confetti i {
    position: absolute;
    top: -16px;
    width: 9px;
    height: 13px;
    border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(600px) rotate(720deg); opacity: 0.9; } }

  .hint { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; z-index: 3; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Banner im Kartenstil</h1>
  <p>Ereignisse erscheinen als querformatige Karte mit dem passenden Motiv, Kartenrand und Namensschild. Die Karte schwingt ein, ein Lichtschimmer läuft darüber, nach gut drei Sekunden verschwindet sie wieder. Klick auf ein Ereignis spielt es ab.</p>
</header>
<div class="controls">
  <button data-event="win">Sieg</button>
  <button data-event="road">Längste Handelsstraße</button>
  <button data-event="army">Größte Rittermacht</button>
  <button data-event="lost">Längste Straße verloren</button>
  <button data-event="monopoly">Monopol</button>
  <button data-event="plenty">Erfindung</button>
  <button data-event="turn">Du bist dran</button>
  <button class="loop" data-event="loop">Alle nacheinander</button>
</div>
<div class="stage" id="stage"><span class="hint">Ereignis oben auswählen</span></div>

<script>
  const CARD = (k) => `../../../public/cards/symbolstark/${k}.png`; // Originale: die Web-Fassungen sind für Banner zu klein
  const EVENTS = {
    win: { art: 'victoryPoint', pos: 'center 30%', title: 'Lukas gewinnt!', who: ['Lukas', '#d23c3c'], tag: '10 Siegpunkte', seal: '🏆', cls: 'win', confetti: true },
    road: { art: 'roadBuilding', pos: 'center 55%', title: 'Längste Handelsstraße', who: ['Mira', '#2f64d6'], tag: '+2 Punkte', seal: '6' },
    army: { art: 'knight', pos: 'center 35%', title: 'Größte Rittermacht', who: ['Paul', '#ee8a1c'], tag: '+2 Punkte', seal: '3' },
    lost: { art: 'roadBuilding', pos: 'center 55%', title: 'Straße überholt', who: ['Paul', '#ee8a1c'], tag: 'übernimmt von Mira', seal: '7' },
    monopoly: { art: 'monopoly', pos: 'center 45%', title: 'Monopol auf Getreide', who: ['Jana', '#f4f1e8'], tag: 'bekommt 6 Karten' },
    plenty: { art: 'yearOfPlenty', pos: 'center 45%', title: 'Erfindung', who: ['Mira', '#2f64d6'], tag: 'nimmt 2 Rohstoffe' },
    turn: { art: 'back', pos: 'center 40%', title: 'Du bist dran', who: ['Lukas', '#d23c3c'], tag: 'Zug 14' },
  };
  const stage = document.getElementById('stage');

  function show(key) {
    const e = EVENTS[key];
    stage.querySelectorAll('.banner, .confetti').forEach((el) => el.remove());
    const b = document.createElement('figure');
    b.className = 'banner ' + (e.cls ?? '');
    b.style.setProperty('--art', `url(${CARD(e.art)})`);
    b.style.setProperty('--pos', e.pos);
    b.innerHTML = `${e.seal ? `<div class="seal">${e.seal}</div>` : ''}
      <figcaption class="plate"><b>${e.title}</b><span><i style="--c:${e.who[1]}"></i>${e.who[0]} <em>${e.tag}</em></span></figcaption>`;
    stage.append(b);
    if (e.confetti) {
      const c = document.createElement('div');
      c.className = 'confetti';
      const colors = ['#d23c3c', '#2f64d6', '#e6c24a', '#2f9a48', '#ee8a1c', '#f4f1e8'];
      for (let i = 0; i < 80; i++) {
        const p = document.createElement('i');
        p.style.left = Math.random() * 100 + '%';
        p.style.background = colors[i % colors.length];
        p.style.animationDuration = 2.4 + Math.random() * 1.8 + 's';
        p.style.animationDelay = Math.random() * 0.8 + 's';
        c.append(p);
      }
      stage.append(c);
    }
  }

  let loopTimer;
  document.querySelectorAll('.controls button').forEach((btn) => btn.addEventListener('click', () => {
    clearInterval(loopTimer);
    if (btn.dataset.event !== 'loop') return show(btn.dataset.event);
    const keys = Object.keys(EVENTS);
    let i = 0;
    show(keys[i]);
    loopTimer = setInterval(() => show(keys[++i % keys.length]), 4200);
  }));
  show('road');
</script>
</body>
</html>
